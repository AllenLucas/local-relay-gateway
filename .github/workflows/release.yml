name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o dist/local-relay-gateway-${GITHUB_REF_NAME}-windows-amd64.exe \
            ./cmd/local-relay-gateway

      - name: Build windows/arm64
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/local-relay-gateway-${GITHUB_REF_NAME}-windows-arm64.exe \
            ./cmd/local-relay-gateway

      - name: Build windows/386
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/local-relay-gateway-${GITHUB_REF_NAME}-windows-386.exe \
            ./cmd/local-relay-gateway

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
