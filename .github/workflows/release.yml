name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v0.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.tag }}"
            git fetch --force --tags
            git checkout "$release_tag"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o dist/local-relay-gateway-${RELEASE_TAG}-windows-amd64.exe \
            ./cmd/local-relay-gateway

      - name: Build windows/arm64
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/local-relay-gateway-${RELEASE_TAG}-windows-arm64.exe \
            ./cmd/local-relay-gateway

      - name: Build windows/386
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/local-relay-gateway-${RELEASE_TAG}-windows-386.exe \
            ./cmd/local-relay-gateway

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
